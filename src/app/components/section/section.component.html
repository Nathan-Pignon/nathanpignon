<section class="section section--{{ background() }}" [id]="sectionId()">
  <app-container [size]="containerSize()">
    @if (title()) {
      <header class="section-head">
        <h2 class="section-title">{{ title() }}</h2>
        @if (subtitle()) {
          <p class="section-subtitle">{{ subtitle() }}</p>
        }
      </header>
    }
    <ng-content></ng-content>
  </app-container>
</section>
