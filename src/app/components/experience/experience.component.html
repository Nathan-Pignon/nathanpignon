<app-section sectionId="experience" [title]="'experience.sectionTitle' | translate" [subtitle]="'experience.sectionSubtitle' | translate" containerSize="md" background="alt">
  <ol class="timeline">
    <li class="timeline-item" *ngFor="let item of experience()">
      <div class="timeline-marker" [class.timeline-marker--pulse]="item.ongoing" aria-hidden="true"></div>
      <div class="timeline-content">
        <div class="timeline-head">
          <h3>{{ item.company }}</h3>
          <app-badge *ngIf="item.duration" [tone]="item.ongoing ? 'accent' : 'neutral'" [pulse]="!!item.ongoing">{{ item.duration }}</app-badge>
        </div>
        <p class="timeline-role">{{ item.role }}</p>
        <p class="timeline-summary">{{ item.summary }}</p>
        <div class="timeline-tags">
          <app-badge *ngFor="let tag of item.tags">{{ tag }}</app-badge>
        </div>
      </div>
    </li>
  </ol>
</app-section>
