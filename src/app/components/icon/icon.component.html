<svg class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
  @switch (name()) {
    @case ('bars') {
      <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    }
    @case ('download') {
      <path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 18h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('arrow-right') {
      <path d="M4 12h15m0 0-5.5-5.5M19 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('arrow-up') {
      <path d="M12 19V5m0 0-5.5 5.5M12 5l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('external-link') {
      <path d="M9.5 6H6.5A2.5 2.5 0 0 0 4 8.5v9A2.5 2.5 0 0 0 6.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3M14 4h6v6M20 4l-9.5 9.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('send') {
      <path d="M3.5 11.2 20.5 4 13 21l-2.2-7.3-7.3-2.5z" fill="currentColor"/>
    }
    @case ('chevron-down') {
      <path d="M5 8.5 12 15l7-6.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('layers') {
      <path d="M12 3.5 4 8l8 4.5 8-4.5-8-4.5Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M4 12.5 12 17l8-4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16.5 12 21l8-4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('pipeline') {
      <path d="M23 4v6h-6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 20v-6h6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('shield') {
      <path d="M12 3.5 19 6v5.5c0 4.2-2.9 7.2-7 9-4.1-1.8-7-4.8-7-9V6l7-2.5Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M9 12l2 2 4-4.5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('layout') {
      <rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.75"/>
      <path d="M3.5 9.5h17M9 9.5V19.5" fill="none" stroke="currentColor" stroke-width="1.75"/>
    }
  }
</svg>
