<app-section sectionId="projects" [title]="'projects.sectionTitle' | translate" [subtitle]="'projects.sectionSubtitle' | translate">
  <div class="projects-featured">
    @for (project of featuredProjects(); track project.name) {
      <app-project-card [project]="project" [featured]="true"></app-project-card>
    }
  </div>

  <div class="projects-grid">
    @for (project of standardProjects(); track project.name) {
      <app-project-card [project]="project"></app-project-card>
    }
  </div>
</app-section>
