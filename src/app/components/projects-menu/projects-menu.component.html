<div class="menu-container" id="projects-menu">
  <!-- Version mobile -->
  <div class="mobile-menu">
    <button class="arrow arrow-left" (click)="previousProjectType()">
      <i class="fa fa-chevron-left"></i>
    </button>
    <div class="mobile-selected">
      <app-card *ngFor="let projectType of projectTypes"
                [style]="projectType.type + ' projects-menu ' + projectTypeIsSelected(projectType.type)"
                (click)="selectProjectType(projectType.type)">
        <h3>{{ projectType.name }}</h3>
      </app-card>
    </div>
    <button class="arrow arrow-right" (click)="nextProjectType()">
      <i class="fa fa-chevron-right"></i>
    </button>
  </div>

  <div class="menu desktop-menu">
    <div class="menu-item" *ngFor="let projectType of projectTypes" trackBy="project.name">
      <app-card [style]="projectType.type + ' projects-menu ' + projectTypeIsSelected(projectType.type)"
                (click)="selectProjectType(projectType.type)">
        <h3>{{ projectType.name }}</h3>
      </app-card>
    </div>
  </div>
</div>
